version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stock_analyst_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-stock_analyst}
    ports:
      - "127.0.0.1:5432:5432" # Tailscale経由での直接アクセスは不要、ローカルのみ
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_analyst_backend
    ports:
      - "8080:8080" # Tailscale IP でアクセス可能にするため 0.0.0.0 にバインド。ホストのファイアウォールで 8080 番ポートの外部公開は遮断する想定。
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-stock_analyst}
      BACKEND_PORT: 8080
      FMP_API_KEY: ${FMP_API_KEY:-mock_fmp_key}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-mock_llm_key}
      LLM_MODEL: ${LLM_MODEL:-argon}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-mock_line_token}
      LINE_USER_ID: ${LINE_USER_ID:-mock_line_user_id}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build時に必要なAPI URL。通常TailscaleのIPか、デプロイ時に決まるURL
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: stock_analyst_frontend
    ports:
      - "3000:3000" # Tailscale IP でアクセス可能にするため 0.0.0.0 にバインド。ホストのファイアウォールで 3000 番ポートの外部公開は遮断する想定。
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
